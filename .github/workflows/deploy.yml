# Manual push-deploy over SSH (fallback only).
#
# Normal deploys are pull-based: the server runs scripts/pull_deploy.sh every
# 2 minutes and deploys new main commits once CI is green, so no secrets are
# needed here. This workflow is for forcing a deploy from GitHub; it needs
# repository secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# (scripts/setup_github_deploy.sh prints the key).

name: Deploy production (manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            INSTALL_DIR=/opt/closet-org
            git config --global --add safe.directory "${INSTALL_DIR}" || true
            if [[ ! -f "${INSTALL_DIR}/scripts/deploy_prod.sh" ]]; then
              echo "Bootstrap: deploy script missing, pulling origin/main..."
              git -C "${INSTALL_DIR}" fetch origin main
              git -C "${INSTALL_DIR}" checkout -B main origin/main
            fi
            sudo bash "${INSTALL_DIR}/scripts/deploy_prod.sh"
